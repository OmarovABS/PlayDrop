<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D'VORA · Искусственный интеллект</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="tg:viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/main.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<!-- TOP BAR -->
<header class="navbar" id="topbar">
  <div class="navbar-inner">
    <a class="back-btn" href="index.html" aria-label="Назад к услугам">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><use href="#i-nav-chevron"/></svg>
      <span class="back-txt">Услуги</span>
    </a>

    <nav class="seg" aria-label="Разделы">
      <span class="seg-thumb" id="segThumb" aria-hidden="true"></span>
      <a href="#subscriptions" class="seg-opt is-on">Подписки</a>
    </nav>
  </div>
</header>

<!-- SUBSCRIPTIONS -->
<section class="sec sec-subs" id="subscriptions">
  <div class="wrap">
    <div class="sec-head center sec-head--panel">
      <span class="sub-eyebrow">D'VORA AI</span>
      <h2>Подписки на нейросети</h2>
      <p>Пять самых популярных ИИ-сервисов. Скоро здесь появится возможность оформить подписку на любой из них.</p>
    </div>

    <div class="ai-grid">

      <div class="ai-item ai-item--chatgpt">
        <span class="ai-tile"><img src="assets/images/i_i/chatgpt_plus.webp" alt="ChatGPT Plus"></span>
        <span class="ai-name">ChatGPT Plus</span>
      </div>

      <div class="ai-item ai-item--claude">
        <span class="ai-tile"><img src="assets/images/i_i/claude_pro.jpg" alt="Claude Pro"></span>
        <span class="ai-name">Claude Pro</span>
      </div>

      <div class="ai-item ai-item--gemini">
        <span class="ai-tile"><img src="assets/images/i_i/gemini_advanced.jpg" alt="Gemini Advanced"></span>
        <span class="ai-name">Gemini Advanced</span>
      </div>

      <div class="ai-item ai-item--midjourney">
        <span class="ai-tile"><img src="assets/images/i_i/Midjourney_Emblem.svg" alt="Midjourney"></span>
        <span class="ai-name">Midjourney</span>
      </div>

      <div class="ai-item ai-item--copilot">
        <span class="ai-tile"><img src="assets/images/i_i/copilot_pro.webp" alt="Copilot Pro"></span>
        <span class="ai-name">Copilot Pro</span>
      </div>

    </div>
  </div>
</section>

<!-- ICONS -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
  <symbol id="i-nav-chevron" viewBox="0 0 12 12">
    <path d="M2.6 4.4L6 7.8l3.4-3.4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<!-- JavaScript Modules -->
<script src="js/main.js"></script>
<script src="js/user.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-drawer.js"></script>
<script src="js/profile.js"></script>
<script src="js/telegram.js"></script>
</body>
</html>
